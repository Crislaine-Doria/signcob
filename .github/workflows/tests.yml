name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.2.3'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Prepare disposable database password
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'SIGNCOB_POSTGRES_TEST_PASSWORD=%s\nSERVERPOD_PASSWORD_database=%s\n' "$password" "$password" >> "$GITHUB_ENV"

      - name: Start containers
        working-directory: packages/signcob_server
        run: docker compose up -d postgres_test

      - name: Install dependencies
        working-directory: packages/signcob_server
        run: dart pub get

      - name: Install Serverpod CLI
        working-directory: packages/signcob_server
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: packages/signcob_server
        run: serverpod generate

      - name: Run tests
        working-directory: packages/signcob_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: packages/signcob_server
        run: docker compose down -v
