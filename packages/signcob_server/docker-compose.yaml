services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: signcob
      POSTGRES_PASSWORD: ${SIGNCOB_POSTGRES_PASSWORD:-}
    volumes:
      - signcob_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command:
      - /bin/sh
      - -ec
      - exec docker-entrypoint.sh redis-server --requirepass "$${SIGNCOB_REDIS_PASSWORD:?Set SIGNCOB_REDIS_PASSWORD}"
    environment:
      - REDIS_REPLICATION_MODE=master
      - SIGNCOB_REDIS_PASSWORD

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: signcob_test
      POSTGRES_PASSWORD: ${SIGNCOB_POSTGRES_TEST_PASSWORD:-}
    volumes:
      - signcob_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command:
      - /bin/sh
      - -ec
      - exec docker-entrypoint.sh redis-server --requirepass "$${SIGNCOB_REDIS_TEST_PASSWORD:?Set SIGNCOB_REDIS_TEST_PASSWORD}"
    environment:
      - REDIS_REPLICATION_MODE=master
      - SIGNCOB_REDIS_TEST_PASSWORD

volumes:
  signcob_data:
  signcob_test_data:
